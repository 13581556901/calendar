
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Aura - Premium Desktop Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --accent-color: #6366f1;
            --accent-color-rgb: 99, 102, 241;
            --glass-opacity: 0.88;
            --glass-blur: 30px;
        }

        body {
            background-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mesh-gradient {
            background: 
                radial-gradient(at 0% 0%, rgba(var(--accent-color-rgb), 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
            filter: blur(40px);
            animation: mesh-flow 15s ease-in-out infinite alternate;
        }

        @keyframes mesh-flow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(5px, 5px); }
        }

        .noise-overlay {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .theme-transition {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes orb-breathing {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px -5px var(--accent-color); }
            50% { transform: scale(1.04); box-shadow: 0 0 40px 5px var(--accent-color); }
        }
        .animate-orb {
            animation: orb-breathing 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .font-mono-premium {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.07em;
        }

        .active-tab-glow {
            box-shadow: 0 0 25px -2px var(--accent-color);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }
        
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-ticker {
            animation: ticker-scroll 60s linear infinite;
        }
        .animate-ticker:hover {
            animation-play-state: paused;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
